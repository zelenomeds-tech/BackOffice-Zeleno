/* =====================================================================
   TELA DE LOGIN
   ===================================================================== */
#login{
  position:relative;z-index:2;
  min-height:100vh;min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.caixa{
  width:100%;max-width:380px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:20px;
  padding:34px 30px 30px;
  box-shadow:0 1px 2px rgba(16,32,24,.04), 0 26px 54px -30px rgba(16,32,24,.30);
}
.caixa .topo{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px}
.caixa h1{font-size:20px;font-weight:600;letter-spacing:-.025em}
.caixa .sub{font-size:13.5px;color:var(--muted);margin-top:-8px}

.campo{margin-top:16px}
.campo label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:7px;letter-spacing:.01em}
.campo input{
  width:100%;padding:12px 14px;
  border:1px solid var(--line);border-radius:11px;
  font-size:15px;font-family:inherit;color:var(--ink);
  background:var(--paper);outline:none;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
.campo input:focus{border-color:var(--zeleno);background:var(--white);box-shadow:0 0 0 3px rgba(0,84,31,.10)}

.botao{
  width:100%;margin-top:24px;padding:13px;
  border:none;border-radius:11px;cursor:pointer;
  background:linear-gradient(90deg,#00541f,#001202);
  color:#fff;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;
  transition:opacity .2s ease, transform .2s ease;
}
.botao:hover{opacity:.92}
.botao:active{transform:translateY(1px)}
.botao:disabled{opacity:.55;cursor:default;transform:none}

.aviso{
  display:none;margin-top:16px;padding:11px 13px;
  background:#fdf0f0;border:1px solid #f4d4d4;border-radius:11px;
  color:var(--erro);font-size:13px;line-height:1.45;text-align:center;
}
.aviso.aparece{display:block}

/* =====================================================================
   MENU (depois do login)
   ===================================================================== */
#menu{
  position:relative;z-index:2;
  width:100%;max-width:860px;margin:0 auto;
  padding:28px 26px calc(30px + env(safe-area-inset-bottom));
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;
}

.barra{
  display:flex;align-items:center;gap:11px;
  padding-bottom:22px;border-bottom:1px solid var(--line);
}
.barra .nome{font-size:15px;font-weight:600;letter-spacing:-.012em}
.barra .quem{
  margin-left:auto;display:flex;align-items:center;gap:14px;
  font-size:12.5px;color:var(--muted);
}
.sair{
  border:1px solid var(--line);background:var(--white);
  border-radius:9px;padding:7px 12px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);
  transition:border-color .2s ease,color .2s ease;
}
.sair:hover{border-color:var(--zeleno);color:var(--zeleno)}

.abertura{margin:clamp(48px,10vh,92px) 0 clamp(40px,7vh,64px)}
.abertura h2{font-size:clamp(40px,8.5vw,66px);font-weight:600;line-height:1;letter-spacing:-.045em}
.abertura h2 span{display:block;font-weight:300;color:var(--muted);letter-spacing:-.038em}
.abertura p{margin-top:20px;color:var(--muted);font-size:15.5px;line-height:1.6;max-width:38ch}

.lista{border-top:1px solid var(--line)}

.linha{
  position:relative;display:grid;align-items:center;
  grid-template-columns:auto 1fr auto auto;gap:16px;
  padding:17px 16px;color:inherit;text-decoration:none;border-radius:14px;
  transition:background-color .28s ease, box-shadow .28s ease, transform .28s cubic-bezier(.2,.8,.2,1);
}
.linha::after{
  content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;
  background:var(--line);transition:opacity .22s ease;
}
.linha:hover,.linha:focus-visible{
  background:var(--white);
  box-shadow:0 1px 2px rgba(16,32,24,.05), 0 16px 34px -22px rgba(16,32,24,.28);
  transform:translateY(-1px);
}
.linha:hover::after,.linha:focus-visible::after{opacity:0}
.linha:has(+ .linha:hover)::after,.linha:has(+ .linha:focus-visible)::after{opacity:0}
.linha:focus-visible{outline:1.5px solid var(--zeleno);outline-offset:2px}

.linha .ic{
  flex:0 0 auto;display:grid;place-items:center;
  width:40px;height:40px;border-radius:11px;
  background:var(--wash);border:1px solid var(--line-soft);color:var(--zeleno);
  transition:background .28s ease,color .28s ease,border-color .28s ease;
}
.linha:hover .ic,.linha:focus-visible .ic{
  background:linear-gradient(90deg,#00541f,#001202);border-color:transparent;color:#fff;
}
.linha .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}

.linha .t{display:block;font-size:17.5px;font-weight:600;letter-spacing:-.018em;line-height:1.25}
.linha .d{display:block;margin-top:2px;color:var(--muted);font-size:13.5px;line-height:1.45}
.linha .slug{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.01em;white-space:nowrap;opacity:.72}
.linha .go{flex:0 0 auto;color:var(--zeleno);font-size:15px;line-height:1;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.linha:hover .go,.linha:focus-visible .go{transform:translateX(5px)}

@media (max-width:640px){
  .linha{grid-template-columns:auto 1fr auto;gap:14px;padding:16px 13px}
  .linha::after{left:13px;right:13px}
  .linha .slug{display:none}
}

.rodape{
  margin-top:auto;padding-top:28px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-size:10.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
}
.rodape .dica{opacity:.7}
@media (hover:none){ .rodape .dica{display:none} }

/* ---------- entrada ---------- */
.sobe{opacity:0;transform:translateY(10px);animation:sobe .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes sobe{to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .sobe{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="wash"></div>
<div class="leafmark"></div>

<!-- ===================== LOGIN ===================== -->
<div id="login" class="oculto">
  <div class="caixa sobe">
    <div class="topo">
      <div class="mark grande" role="img" aria-label="Zeleno"></div>
      <h1>Backoffice Zeleno</h1>
      <div class="sub">Entre com seu email de trabalho.</div>
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="seunome@zelenomeds.com" />
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha" />
    </div>

    <div class="aviso" id="aviso"></div>

    <button class="botao" id="entrar" type="button">Entrar</button>
  </div>
</div>

<!-- ===================== MENU ===================== -->
<main id="menu" class="oculto">
  <header class="barra sobe">
    <div class="mark" role="img" aria-label="Zeleno"></div>
    <div class="nome">Zeleno</div>
    <div class="quem">
      <span id="quemEmail"></span>
      <button class="sair" id="sair" type="button">Sair</button>
    </div>
  </header>

  <section class="abertura sobe" style="animation-delay:.08s">
    <h2 id="ola">Olá<span id="primeiroNome"></span></h2>
    <p id="resumo">Escolha um atalho. Abre em uma nova aba.</p>
  </section>

  <nav class="lista" id="lista"></nav>

  <footer class="rodape sobe" style="animation-delay:.4s">
    <div>Zeleno &middot; uso interno</div>
    <div class="dica" id="dica"></div>
  </footer>
</main>

<script>
(function(){
  'use strict';

  var ICONES = {
    descontos:  '<line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
    vendedores: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    design:     '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 15.5l4.2-4.2a2 2 0 0 1 2.8 0L15 16"/><path d="M14 14l1.6-1.6a2 2 0 0 1 2.8 0L21 15"/><circle cx="8.5" cy="8.5" r="1.4"/>',
    ti:         '<rect x="2.5" y="4" width="19" height="14" rx="2.5"/><polyline points="7 9 10 12 7 15"/><line x1="12.5" y1="15" x2="17" y2="15"/>',
    cs:         '<path d="M3 18v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="9" cy="7" r="3.4"/><path d="M17.5 14.5l2 2 4-4"/>'
  };

  var el = function(id){ return document.getElementById(id); };
  var atalhos = [];

  function mostrar(qual){
    el('login').classList.toggle('oculto', qual !== 'login');
    el('menu').classList.toggle('oculto', qual !== 'menu');
  }

  function escapar(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function montarMenu(dados){
    el('primeiroNome').textContent = dados.nome || '';
    el('quemEmail').textContent = dados.email || '';

    var paineis = dados.paineis || [];
    el('resumo').textContent = paineis.length === 1
      ? 'Você tem acesso a um painel. Abre em uma nova aba.'
      : 'Você tem acesso a ' + paineis.length + ' painéis. Abre em uma nova aba.';

    var html = '';
    atalhos = [];
    paineis.forEach(function(p, i){
      var n = i + 1;
      atalhos.push('/api/ir?p=' + encodeURIComponent(p.id));
      html += '<a class="linha sobe" style="animation-delay:' + (0.16 + i * 0.06).toFixed(2) + 's"'
           +  ' href="/api/ir?p=' + encodeURIComponent(p.id) + '" target="_blank" rel="noopener">'
           +  '<span class="ic"><svg viewBox="0 0 24 24">' + (ICONES[p.id] || '') + '</svg></span>'
           +  '<span>'
           +    '<span class="t">' + escapar(p.nome) + '</span>'
           +    '<span class="d">' + escapar(p.desc || '') + '</span>'
           +  '</span>'
           +  '<span class="slug">' + escapar(p.slug || '') + '</span>'
           +  '<span class="go" aria-hidden="true">&rarr;</span>'
           +  '</a>';
    });
    el('lista').innerHTML = html;
    el('dica').textContent = paineis.length > 1 ? 'Teclas 1 – ' + paineis.length : '';
    mostrar('menu');
  }

  function erroLogin(msg){
    var a = el('aviso');
    a.textContent = msg;
    a.classList.add('aparece');
  }

  async function entrar(){
    el('aviso').classList.remove('aparece');
    var email = el('email').value.trim();
    var senha = el('senha').value;
    if(!email || !senha){ erroLogin('Preencha email e senha.'); return; }

    var btn = el('entrar');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try{
      var r = await fetch('/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: email, senha: senha })
      });
      var d = await r.json().catch(function(){ return {}; });
      if(r.ok && d && d.ok){ el('senha').value = ''; montarMenu(d); return; }
      erroLogin((d && d.message) || 'Email ou senha incorretos.');
    }catch(e){
      erroLogin('Não deu para conectar. Tente de novo.');
    }
    btn.disabled = false; btn.textContent = 'Entrar';
  }

  async function sair(){
    try{ await fetch('/api/logout', { method:'POST' }); }catch(e){}
    atalhos = [];
    el('email').value = '';
    el('senha').value = '';
    mostrar('login');
    el('email').focus();
  }

  el('entrar').addEventListener('click', entrar);
  el('senha').addEventListener('keydown', function(e){ if(e.key === 'Enter') entrar(); });
  el('email').addEventListener('keydown', function(e){ if(e.key === 'Enter') el('senha').focus(); });
  el('sair').addEventListener('click', sair);

  document.addEventListener('keydown', function(e){
    if(el('menu').classList.contains('oculto')) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var i = parseInt(e.key, 10);
    if(i >= 1 && i <= atalhos.length){
      e.preventDefault();
      window.open(atalhos[i - 1], '_blank', 'noopener');
    }
  });

  // Ao abrir: se já existe sessão válida, pula direto pro menu.
  (async function inicio(){
    try{
      var r = await fetch('/api/sessao', { cache:'no-store' });
      var d = await r.json().catch(function(){ return {}; });
      if(d && d.ok){ montarMenu(d); return; }
    }catch(e){}
    mostrar('login');
    el('email').focus();
  })();
})();
</script>

</body>
</html>
